<!DOCTYPE html>
<html>
  <head>
    <title>Weather</title>
    <style>
      .hot { color: orangered; }
      .cool { color: #1E88E5; }
      .cold { color: rgb(0, 150, 200); }
    </style>
  </head>
  <body>
    <h1>Tashkent weather</h1>
    <h3 class="hot">☀ July: +35° — super hot</h3>
    <h3 class="cool">⛅ October: +18° — cool</h3>
    <h3 class="cold">❄ January: −5° — cold</h3>
  </body>
</html>
