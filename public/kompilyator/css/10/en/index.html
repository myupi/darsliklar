<!DOCTYPE html>
<html>
  <head>
    <title>Profile</title>
    <style>
      body { font-family: Arial, sans-serif; }
      .profile { display: flex; flex-direction: row; }
      .photo { width: 80px; height: 80px; border-radius: 50%; background-color: #FFCC80; font-size: 44px; text-align: center; margin-right: 14px; }
      .info { display: flex; flex-direction: column; }
      .nickname { color: gray; }
      .stats { display: flex; margin-top: 12px; }
      .stat { width: 33%; text-align: center; background-color: #F5F5F5; padding: 6px; margin-right: 4px; }
    </style>
  </head>
  <body>
    <div class="profile">
      <div class="photo">😎</div>
      <div class="info">
        <b>Aziz Karimov</b>
        <span class="nickname">@aziz_code</span>
        <span>Future coder! 🚀</span>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b>24</b><br>posts</div>
      <div class="stat"><b>310</b><br>followers</div>
      <div class="stat"><b>180</b><br>following</div>
    </div>
  </body>
</html>
