<!DOCTYPE html>
<html>
  <head>
    <title>To'garaklar</title>
    <style>
      body { font-family: Arial, sans-serif; }
      .kartalar { display: flex; gap: 5%; }
      .karta { width: 30%; padding: 12px; border-radius: 10px; background-color: #E3F2FD; text-align: center; box-sizing: border-box; }
      .belgi { font-size: 34px; }
      @media (max-width: 600px) {
        .kartalar { flex-direction: column; }
        .karta { width: 100%; margin-bottom: 8px; }
      }
    </style>
  </head>
  <body>
    <h2>Bizning to'garaklar</h2>
    <div class="kartalar">
      <div class="karta"><div class="belgi">⚽</div><b>Futbol</b></div>
      <div class="karta"><div class="belgi">🤖</div><b>Robototexnika</b></div>
      <div class="karta"><div class="belgi">🎨</div><b>Rasm</b></div>
    </div>
  </body>
</html>
