<!DOCTYPE html>
<html>
  <head>
    <title>Clubs</title>
    <style>
      body { font-family: Arial, sans-serif; }
      .cards { display: flex; gap: 5%; }
      .card { width: 30%; padding: 12px; border-radius: 10px; background-color: #E3F2FD; text-align: center; box-sizing: border-box; }
      .icon { font-size: 34px; }
      @media (max-width: 600px) {
        .cards { flex-direction: column; }
        .card { width: 100%; margin-bottom: 8px; }
      }
    </style>
  </head>
  <body>
    <h2>Our clubs</h2>
    <div class="cards">
      <div class="card"><div class="icon">⚽</div><b>Football</b></div>
      <div class="card"><div class="icon">🤖</div><b>Robotics</b></div>
      <div class="card"><div class="icon">🎨</div><b>Art</b></div>
    </div>
  </body>
</html>
