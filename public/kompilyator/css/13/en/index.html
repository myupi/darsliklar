<!DOCTYPE html>
<html>
  <head>
    <title>Music site</title>
    <style>
      body { font-family: Arial, sans-serif; }
      .albums { display: flex; gap: 10px; }
      .album { width: 50%; padding: 10px; border-radius: 12px; background-color: #EDE7F6; cursor: pointer; }
      .album:hover { transform: translate(0px, -8px); }
      .cover { font-size: 40px; text-align: center; border-radius: 8px; background-color: #7E57C2; }
      button { padding: 6px 12px; border: 0; border-radius: 16px; background-color: #1DB954; cursor: pointer; }
      button:hover { transform: scale(1.2); }
      .heart { display: inline-block; font-size: 20px; color: gray; cursor: pointer; }
      .heart:hover { transform: scale(1.3); color: red; }
      .refresh { display: inline-block; cursor: pointer; }
      .refresh:hover { transform: rotate(180deg); }
    </style>
  </head>
  <body>
    <h3>For you <span class="refresh">🔄</span></h3>
    <div class="albums">
      <div class="album"><div class="cover">💿</div><b>Summer hits</b><p><button>▶</button> <span class="heart">❤</span></p></div>
      <div class="album"><div class="cover">🎸</div><b>Rock night</b><p><button>▶</button> <span class="heart">❤</span></p></div>
    </div>
  </body>
</html>
