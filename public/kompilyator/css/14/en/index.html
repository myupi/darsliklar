<!DOCTYPE html>
<html>
  <head>
    <title>Plans</title>
    <style>
      body { font-family: Arial, sans-serif; background-color: #F4F6F8; }
      .plans { display: flex; gap: 10px; }
      .plan {
        width: 50%;
        padding: 12px;
        border-radius: 12px;
        background-color: white;
        text-align: center;
        transition: all 0.4s ease;
      }
      .plan:hover { transform: translate(0px, -8px); box-shadow: 0px 10px 18px silver; }
      button {
        padding: 8px 14px;
        border: 0;
        border-radius: 8px;
        background-color: #FA4F28;
        color: white;
        transition: background-color 300ms linear;
      }
      button:hover { background-color: #B71C1C; }
    </style>
  </head>
  <body>
    <h2>Choose your plan</h2>
    <div class="plans">
      <div class="plan"><h3>Basic</h3><p>HD, 1 device</p><b>29,000 UZS</b><p><button>Choose</button></p></div>
      <div class="plan"><h3>Family</h3><p>4K, 4 devices</p><b>59,000 UZS</b><p><button>Choose</button></p></div>
    </div>
  </body>
</html>
