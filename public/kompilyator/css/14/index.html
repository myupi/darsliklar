<!DOCTYPE html>
<html>
  <head>
    <title>Tariflar</title>
    <style>
      body { font-family: Arial, sans-serif; background-color: #F4F6F8; }
      .tariflar { display: flex; gap: 10px; }
      .tarif {
        width: 50%;
        padding: 12px;
        border-radius: 12px;
        background-color: white;
        text-align: center;
        transition: all 0.4s ease;
      }
      .tarif:hover { transform: translate(0px, -8px); box-shadow: 0px 10px 18px silver; }
      button {
        padding: 8px 14px;
        border: 0;
        border-radius: 8px;
        background-color: #FA4F28;
        color: white;
        transition: background-color 300ms linear;
      }
      button:hover { background-color: #B71C1C; }
    </style>
  </head>
  <body>
    <h2>Tarifni tanlang</h2>
    <div class="tariflar">
      <div class="tarif"><h3>Oddiy</h3><p>HD, 1 qurilma</p><b>29 000 so'm</b><p><button>Tanlash</button></p></div>
      <div class="tarif"><h3>Oilaviy</h3><p>4K, 4 qurilma</p><b>59 000 so'm</b><p><button>Tanlash</button></p></div>
    </div>
  </body>
</html>
