<!DOCTYPE html>

    <style>
      body { font-family: Arial, sans-serif; }
      .color { display: inline-block; width: 28px; height: 28px; border-radius: 50%; margin-right: 6px; }

      #red { background-color: #E53935; }
      #blue { background-color: #1E88E5; }

      #xl { display: none; }
      a { display: block; text-align: center; padding: 10px; margin-top: 14px; background-color: #FA4F28; color: white; text-decoration: none; }
    </style>
  </head>
  <body>
    <h3>“Kodi” T-shirt — 89,000 UZS</h3>
    <p>Color:</p>
    <span class="color" id="black"></span><span class="color" id="red"></span><span class="color" id="blue"></span>
    <p>Size:</p>
    <span class="size">S</span><span class="size">M</span><span class="size">L</span><span class="size" id="xl">XL</span>
