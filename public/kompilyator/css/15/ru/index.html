<!DOCTYPE html>
<html>
  <head>
    <title>Главная</title>
    <style>
      body { font-family: Arial, sans-serif; text-align: center; background-color: #1B1F2E; color: white; padding-bottom: 24px; }
      @keyframes jump {
        from { transform: translate(0px, 0px); }
        to { transform: translate(0px, 14px); }
      }
      .arrow {
        display: inline-block;
        font-size: 34px;
        color: #FFB74D;
        animation: jump 0.6s infinite alternate;
      }
    </style>
  </head>
  <body>
    <h1>Лагерь Коди 2026</h1>
    <p>Проведи лето с программированием!</p>
    <p>Листай вниз</p>
    <div class="arrow">↓</div>
  </body>
</html>
