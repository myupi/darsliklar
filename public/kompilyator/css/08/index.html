<!DOCTYPE html>

      body { background-color: #F4F6F8; font-family: Arial, sans-serif; }

    </style>
  </head>
  <body>
    <div class="karta">
      <div class="rasm">👟</div>
      <h2>Tezkor Run 3</h2>
      <p>Yugurish uchun yengil krossovka.</p>
      <span class="narx">450 000 so'm</span>
