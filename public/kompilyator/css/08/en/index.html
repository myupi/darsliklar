<!DOCTYPE html>
<html>
  <head>
    <title>Sneaker shop</title>
    <style>
      body { background-color: #F4F6F8; font-family: Arial, sans-serif; }
      .card {
        width: 240px;
        padding: 16px;
        background-color: white;
        border-radius: 16px;
        box-shadow: 0px 6px 14px silver;
        border-top: 6px solid #FA4F28;
      }
      .image { font-size: 70px; text-align: center; background-color: #FFF3E0; border-radius: 12px; }
      h2 { font-size: 20px; }
      .price { padding: 4px 12px; border-radius: 12px; background-color: #FFD54F; font-weight: bold; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="image">👟</div>
      <h2>Speed Run 3</h2>
      <p>Light sneakers made for running.</p>
      <span class="price">450,000 UZS</span>
    </div>
  </body>
</html>
