<!DOCTYPE html>
<html>
  <head>
    <title>Katalog</title>
    <style>
      body { font-family: Arial, sans-serif; }
      .yuqori { display: flex; justify-content: space-between; align-items: center; padding: 8px; background-color: #F5F5F5; }
      .mahsulotlar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 12px 0px; }
      .mahsulot { width: 78px; padding: 8px; border-radius: 10px; background-color: #FFF3E0; text-align: center; font-size: 13px; }
      .belgi { font-size: 34px; }
      .sahifalar { display: flex; justify-content: center; gap: 6px; }
      .sahifa { padding: 4px 10px; border: 1px solid #BDBDBD; border-radius: 6px; }
      #hozir { background-color: #FA4F28; color: white; }
    </style>
  </head>
  <body>
    <div class="yuqori"><span>12 ta mahsulot</span><span>Saralash ▾</span></div>
    <div class="mahsulotlar">
      <div class="mahsulot"><div class="belgi">🎧</div>Quloqchin</div>
      <div class="mahsulot"><div class="belgi">⌚</div>Soat</div>
      <div class="mahsulot"><div class="belgi">🎮</div>Joystik</div>
      <div class="mahsulot"><div class="belgi">📷</div>Kamera</div>
      <div class="mahsulot"><div class="belgi">🔋</div>Powerbank</div>
      <div class="mahsulot"><div class="belgi">🖱</div>Sichqoncha</div>
    </div>
    <div class="sahifalar"><span class="sahifa" id="hozir">1</span><span class="sahifa">2</span><span class="sahifa">3</span></div>
  </body>
</html>
