<!DOCTYPE html>
<html>
  <head>
    <title>Do'kon</title>
    <style>
      body { font-family: Arial, sans-serif; padding-top: 14px; padding-bottom: 50px; }
      .savat { position: relative; padding: 6px 12px; font-size: 22px; background-color: #ECEFF1; border: 0; }
      .son { position: absolute; top: -6px; right: -6px; padding: 2px 7px; border-radius: 10px; background-color: red; color: white; font-size: 12px; }
      .karta { width: 220px; padding: 10px; border-radius: 12px; background-color: white; box-shadow: 0px 4px 12px silver; margin-top: 12px; }
      .rasm { position: relative; font-size: 80px; text-align: center; border-radius: 10px; background-color: #FFF3E0; }
      .chegirma { position: absolute; top: 8px; left: 8px; padding: 3px 8px; border-radius: 6px; background-color: #FA4F28; color: white; font-size: 13px; }
      .sevimli { position: absolute; top: 8px; right: 8px; font-size: 20px; }
      .narx { color: #FA4F28; font-weight: bold; }
      .yordam { position: fixed; bottom: 10px; right: 10px; padding: 10px 16px; border-radius: 20px; border: 0; background-color: #1E88E5; color: white; }
    </style>
  </head>
  <body>
    <button class="savat">🛒<span class="son">3</span></button>
    <div class="karta">
      <div class="rasm">🎧<span class="chegirma">−50%</span><span class="sevimli">❤</span></div>
      <p><b>Simsiz quloqchin</b></p>
      <span class="narx">150 000 so'm</span> <s>300 000</s>
    </div>
    <button class="yordam">💬 Yordam</button>
  </body>
</html>
