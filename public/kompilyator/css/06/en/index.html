<!DOCTYPE html>
<html>
  <head>
    <title>My courses</title>
    <style>
      img { width: 60px; height: 60px; }
      .bar { width: 220px; height: 12px; background-color: #E0E0E0; }
      .html { width: 100%; height: 100%; background-color: #FA4F28; }
      .css { width: 60%; height: 100%; background-color: #1E88E5; }
    </style>
  </head>
  <body>
    <h2>My courses</h2>
    <img src="html.svg" alt="HTML course">
    <p>HTML course — 100% complete</p>
    <div class="bar"><div class="html"></div></div>
    <img src="css.svg" alt="CSS course">
    <p>CSS course — 60%</p>
    <div class="bar"><div class="css"></div></div>
  </body>
</html>
