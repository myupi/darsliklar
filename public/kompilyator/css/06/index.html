<!DOCTYPE html>
<html>
  <head>
    <title>Mening kurslarim</title>
    <style>
      img { width: 60px; height: 60px; }
      .polosa { width: 220px; height: 12px; background-color: #E0E0E0; }
      .html { width: 100%; height: 100%; background-color: #FA4F28; }
      .css { width: 60%; height: 100%; background-color: #1E88E5; }
    </style>
  </head>
  <body>
    <h2>Mening kurslarim</h2>
    <img src="html.svg" alt="HTML kursi">
    <p>HTML kursi — 100% tugatildi</p>
    <div class="polosa"><div class="html"></div></div>
    <img src="css.svg" alt="CSS kursi">
    <p>CSS kursi — 60%</p>
    <div class="polosa"><div class="css"></div></div>
  </body>
</html>
