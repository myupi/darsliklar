<!DOCTYPE html>
<html>
  <head>
    <title>Экипаж на Марс</title>
  </head>
  <body>
    <h1>Запись в экипаж на Марс</h1>
    <form>
      <label>Твоё имя</label>
      <input type="text" placeholder="Например, Азиза">
      <label>Твой возраст</label>
      <input type="number" placeholder="12">
      <label>Пароль</label>
      <input type="password" placeholder="Не меньше 4 символов">
    </form>
  </body>
</html>
