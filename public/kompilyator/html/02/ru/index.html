<!DOCTYPE html>
<html>
  <head>
    <title>Киноафиша</title>
  </head>
  <body>
    <h1>Мой друг — робот</h1>
    <h2>О чём фильм?</h2>
    <p>Маленький <i>Бобур</i> просыпается утром, а на кухне стоит говорящий робот. Вместе они ищут <b>потерянный ключ</b>.</p>
    <h2>Почему стоит посмотреть?</h2>
    <p>Фильм <b>очень смешной</b>, а концовка удивит всех. Смотри с друзьями!</p>
  </body>
</html>
