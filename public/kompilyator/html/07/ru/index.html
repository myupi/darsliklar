<!DOCTYPE html>
<html>
  <head>
    <title>Заказ пиццы</title>
  </head>
  <body>
    <h1>Закажи пиццу</h1>
    <form>
      <label>Твоё имя</label>
      <input type="text" placeholder="Напиши своё имя">
      <label>Какую пиццу?</label>
      <select>
        <option>Маргарита</option>
        <option>Сырная</option>
        <option>Грибная</option>
      </select>
      <label>Особые пожелания</label>
      <textarea placeholder="Например, без лука"></textarea>
      <button>Заказать</button>
    </form>
  </body>
</html>
