<!DOCTYPE html>
<html>
  <head>
    <title>Рецепт</title>
  </head>
  <body>
    <h1>Классный сэндвич</h1>
    <h2>Что понадобится</h2>
    <ul>
      <li>2 ломтика хлеба</li>
      <li>Сыр</li>
      <li>Помидор</li>
      <li>Лист салата</li>
    </ul>
    <h2>Как готовить</h2>
    <ol>
      <li>Нарежь помидор тонкими кружочками.</li>
      <li>На первый ломтик положи сыр, помидор и салат.</li>
      <li>Накрой сверху вторым ломтиком.</li>
      <li>Разрежь сэндвич пополам. Приятного аппетита!</li>
    </ol>
  </body>
</html>
