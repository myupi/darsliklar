<!DOCTYPE html>
<html>
  <head>
    <title>Recipe</title>
  </head>
  <body>
    <h1>Awesome Sandwich</h1>
    <h2>What you need</h2>
    <ul>
      <li>2 slices of bread</li>
      <li>Cheese</li>
      <li>Tomato</li>
      <li>A lettuce leaf</li>
    </ul>
    <h2>How to make it</h2>
    <ol>
      <li>Slice the tomato thinly.</li>
      <li>Put the cheese, tomato and lettuce on the first slice.</li>
      <li>Cover it with the second slice.</li>
      <li>Cut the sandwich in half. Enjoy your meal!</li>
    </ol>
  </body>
</html>
