<!DOCTYPE html>
<html lang="uz" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <title>Grand Prix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  </head>
  <body>
    <main style="padding: 24px">
      <header class="d-flex justify-content-between align-items-center bg-warning" style="padding: 16px 24px; border-radius: 16px">
        <h2>Grand Prix 2026</h2>
        <button class="btn-solid theme-danger">Jonli efir</button>
      </header>
      <h3 style="text-align: center; margin-top: 16px">Poygadagi mashinalar</h3>
      <div class="d-flex justify-content-center gap-5">
        <div style="width: 300px">
          <img src="bmw.jpg" class="img-fluid rounded" alt="BMW M8">
          <p><b>BMW M8</b></p>
        </div>
        <div style="width: 300px">
          <img src="porsche.jpg" class="img-fluid rounded" alt="Porsche 911 Turbo S">
          <p><b>Porsche 911 Turbo S</b></p>
        </div>
        <div style="width: 300px">
          <img src="mercedes.jpg" class="img-fluid rounded" alt="Mercedes-AMG One">
          <p><b>Mercedes-AMG One</b></p>
        </div>
      </div>
      <div class="d-flex justify-content-center gap-3">
        <button class="btn-solid theme-primary">Natijalar</button>
        <button class="btn-outline theme-primary">Chiptalar</button>
      </div>
    </main>
  </body>
</html>
