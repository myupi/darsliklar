<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <title>Автовыставка</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  </head>
  <body>
    <main style="padding: 24px">
      <div class="bg-warning" style="padding: 24px; border-radius: 16px; margin-bottom: 16px">
        <h1>Автовыставка</h1>
        <div class="alert theme-info" role="alert">
          <p>7 декабря, центр города. Детям вход бесплатный!</p>
        </div>
      </div>
      <div style="padding: 24px; border-radius: 16px; margin-bottom: 16px; border: 1px solid #DDE2EA">
        <h3 class="fg-success">Электромобили</h3>
        <p>Машины, которые ездят без бензина.</p>
        <button class="btn-solid theme-success">Взять билет</button>
        <button class="btn-outline theme-success">Подробнее</button>
      </div>
      <div style="padding: 24px; border-radius: 16px; margin-bottom: 16px; border: 1px solid #DDE2EA">
        <h3 class="fg-primary">Спорткары</h3>
        <p>Посмотри самые быстрые машины вблизи.</p>
        <button class="btn-solid theme-primary">Взять билет</button>
        <button class="btn-outline theme-primary">Подробнее</button>
      </div>
      <div style="padding: 24px; border-radius: 16px; margin-bottom: 16px; border: 1px solid #DDE2EA">
        <h3 class="fg-danger">Ретро-машины</h3>
        <p>Красивые машины 50-летней давности.</p>
        <button class="btn-solid theme-danger">Взять билет</button>
        <button class="btn-outline theme-danger">Подробнее</button>
      </div>
      <div class="bg-success" style="padding: 24px; border-radius: 16px; margin-bottom: 16px">
        <p><b>Адрес:</b> Ташкент, улица Амира Темура, 1</p>
        <p><b>Телефон:</b> +998 71 200 00 00</p>
      </div>
    </main>
  </body>
</html>
