<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <title>Car show</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  </head>
  <body>
    <main style="padding: 24px">
      <div class="bg-warning" style="padding: 24px; border-radius: 16px; margin-bottom: 16px">
        <h1>Car show</h1>
        <div class="alert theme-info" role="alert">
          <p>December 7, city center. Free entry for kids!</p>
        </div>
      </div>
      <div style="padding: 24px; border-radius: 16px; margin-bottom: 16px; border: 1px solid #DDE2EA">
        <h3 class="fg-success">Electric cars</h3>
        <p>Cars that run without fuel.</p>
        <button class="btn-solid theme-success">Get a ticket</button>
        <button class="btn-outline theme-success">More</button>
      </div>
      <div style="padding: 24px; border-radius: 16px; margin-bottom: 16px; border: 1px solid #DDE2EA">
        <h3 class="fg-primary">Sports cars</h3>
        <p>See the fastest cars up close.</p>
        <button class="btn-solid theme-primary">Get a ticket</button>
        <button class="btn-outline theme-primary">More</button>
      </div>
      <div style="padding: 24px; border-radius: 16px; margin-bottom: 16px; border: 1px solid #DDE2EA">
        <h3 class="fg-danger">Retro cars</h3>
        <p>Beautiful cars from 50 years ago.</p>
        <button class="btn-solid theme-danger">Get a ticket</button>
        <button class="btn-outline theme-danger">More</button>
      </div>
      <div class="bg-success" style="padding: 24px; border-radius: 16px; margin-bottom: 16px">
        <p><b>Address:</b> Tashkent, Amir Temur street, 1</p>
        <p><b>Phone:</b> +998 71 200 00 00</p>
      </div>
    </main>
  </body>
</html>
