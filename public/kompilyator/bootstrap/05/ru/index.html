<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <title>Автосалон</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  </head>
  <body>
    <main style="padding: 24px">
      <h1 style="text-align: center">Самые быстрые машины</h1>
      <div class="d-flex justify-content-center gap-5">
        <section class="card" style="max-width: 300px">
          <img src="bmw.jpg" class="card-img-top" alt="BMW M8">
          <div class="card-body">
            <h4 class="card-title">BMW M8</h4>
            <p class="card-text fg-success">Скорость: 305 км/ч</p>
            <a href="#" class="btn-outline theme-primary">Смотреть</a>
          </div>
        </section>
        <section class="card card-subtle theme-success" style="max-width: 300px">
          <img src="porsche.jpg" class="card-img-top" alt="Porsche 911 Turbo S">
          <div class="card-body">
            <h4 class="card-title">Porsche 911 Turbo S</h4>
            <p class="card-text fg-success">Скорость: 330 км/ч</p>
            <a href="#" class="btn-solid theme-success">Смотреть</a>
          </div>
        </section>
        <section class="card" style="max-width: 300px">
          <img src="mercedes.jpg" class="card-img-top" alt="Mercedes-AMG One">
          <div class="card-body">
            <h4 class="card-title">Mercedes-AMG One</h4>
            <p class="card-text fg-success">Скорость: 352 км/ч</p>
            <a href="#" class="btn-outline theme-primary">Смотреть</a>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
