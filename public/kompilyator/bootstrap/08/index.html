<!DOCTYPE html>
<html lang="uz" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <title>O'yin klubi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  </head>
  <body>
    <nav class="navbar md:navbar-expand bg-1" data-bs-theme="dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">O'yin klubi</a>
        <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#menyu" aria-label="Menu">
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog class="drawer drawer-end" id="menyu">
          <div class="drawer-header">
            <h5 class="drawer-title">Menyu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
          </div>
          <div class="drawer-body">
            <ul class="nav navbar-nav">
              <li class="nav-item"><a class="nav-link active" href="#">Asosiy</a></li>
              <li class="nav-item"><a class="nav-link" href="#">O'yinlar</a></li>
              <li class="nav-item"><a class="nav-link" href="#">Aloqa</a></li>
            </ul>
          </div>
        </dialog>
      </div>
    </nav>
    <main style="padding: 24px">
      <div class="container">
        <div class="row align-items-center">
          <div class="md:col-6">
            <img src="roblox.jpg" class="img-fluid rounded" alt="Roblox">
          </div>
          <div class="md:col-6">
            <h2>Klubga yozilish</h2>
            <form>
              <label for="ism" class="form-label">Ism</label>
              <input type="text" id="ism" class="form-control" placeholder="Ismingiz">
              <label for="pochta" class="form-label">Pochta</label>
              <input type="email" id="pochta" class="form-control" placeholder="name@mail.uz">
              <label for="oyin" class="form-label">O'yin</label>
              <select id="oyin" class="form-control">
                <option>Roblox</option>
                <option>Minecraft</option>
                <option>eFootball</option>
              </select>
              <div class="form-field">
                <input type="radio" name="kun" id="k1" class="radio" checked>
                <label for="k1">Shanba</label>
              </div>
              <div class="form-field">
                <input type="radio" name="kun" id="k2" class="radio">
                <label for="k2">Yakshanba</label>
              </div>
              <div class="form-field">
                <input type="checkbox" id="qoida" class="check">
                <label for="qoida">Qoidalarga roziman</label>
              </div>
              <button type="submit" class="btn-solid theme-success" style="margin-top: 12px">Yozilish</button>
            </form>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
