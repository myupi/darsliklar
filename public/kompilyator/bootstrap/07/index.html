<!DOCTYPE html>
<html lang="uz" data-bs-theme="light">
  <head>

  </head>
  <body>
    <nav class="navbar md:navbar-expand bg-1" data-bs-theme="dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">O'yin yangiliklari</a>
        <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#menyu" aria-label="Menu">
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog class="drawer drawer-end" id="menyu">
          <div class="drawer-header">
            <h5 class="drawer-title">Menyu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
          </div>
          <div class="drawer-body">
            <ul class="nav navbar-nav">
              <li class="nav-item"><a class="nav-link active" href="#">Asosiy</a></li>
              <li class="nav-item"><a class="nav-link" href="#">Yangiliklar</a></li>
              <li class="nav-item"><a class="nav-link" href="#">O'yinlar</a></li>
              <li class="nav-item"><a class="nav-link" href="#">Aloqa</a></li>
            </ul>
          </div>
        </dialog>
      </div>
    </nav>
    <main style="padding: 24px">
      <div class="container">
        <h2>So'nggi yangiliklar</h2>
        <div class="row">
          <div class="md:col-4">
            <div class="card">
              <img src="minecraft.jpg" class="card-img-top" alt="Minecraft" style="height: 160px; object-fit: cover">
              <div class="card-body">
                <h5>Minecraft</h5>
                <p>Dunyo quring va sarguzashtga chiqing.</p>
              </div>
            </div>
          </div>
          <div class="md:col-4">
            <div class="card">
              <img src="roblox.jpg" class="card-img-top" alt="Roblox" style="height: 160px; object-fit: cover">
              <div class="card-body">
                <h5>Roblox</h5>
                <p>Do'stlar bilan minglab o'yinlar.</p>
              </div>
            </div>
          </div>
          <div class="md:col-4">
            <div class="card">
              <img src="efootball.jpg" class="card-img-top" alt="eFootball" style="height: 160px; object-fit: cover">
              <div class="card-body">
                <h5>eFootball</h5>
                <p>Sevimli jamoangiz bilan futbol.</p>
              </div>
            </div>
          </div>
        </div>
      </div>
      <nav aria-label="Pages" style="margin-top: 24px">
        <ul class="pagination justify-content-center">
          <li class="page-item"><a class="page-link" href="#">Oldingi</a></li>
          <li class="page-item active"><a class="page-link" href="#">1</a></li>

          <li class="page-item"><a class="page-link" href="#">Keyingi</a></li>
        </ul>
      </nav>
