<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <title>Магазин игр</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  </head>
  <body>
    <main style="padding: 24px">
      <div class="container">
        <div class="row">
          <div class="md:col-8">
            <img src="efootball.jpg" class="img-fluid rounded" alt="eFootball" style="width: 100%; height: 250px; object-fit: cover">
          </div>
          <div class="md:col-4">
            <div class="card theme-warning">
              <div class="card-body">
                <h3>Предложение дня</h3>
                <p>eFootball: новый сезон сегодня за полцены!</p>
                <a href="#" class="btn-solid theme-success">Купить</a>
              </div>
            </div>
          </div>
        </div>
        <h2 style="margin-top: 24px">Игры</h2>
        <div class="row">
          <div class="md:col-4">
            <div class="card">
              <img src="minecraft.jpg" class="card-img-top" alt="Minecraft" style="height: 170px; object-fit: cover">
              <div class="card-body">
                <h5>Minecraft</h5>
                <p>Строй мир и отправляйся в приключения.</p>
                <p class="fg-success"><b>90 000 сумов</b></p>
                <a href="#" class="btn-solid theme-primary">Купить</a>
              </div>
            </div>
          </div>
          <div class="md:col-4">
            <div class="card">
              <img src="roblox.jpg" class="card-img-top" alt="Roblox" style="height: 170px; object-fit: cover">
              <div class="card-body">
                <h5>Roblox</h5>
                <p>Тысячи игр с друзьями.</p>
                <p class="fg-success"><b>Бесплатно</b></p>
                <a href="#" class="btn-solid theme-primary">Купить</a>
              </div>
            </div>
          </div>
          <div class="md:col-4">
            <div class="card">
              <img src="efootball.jpg" class="card-img-top" alt="eFootball" style="height: 170px; object-fit: cover">
              <div class="card-body">
                <h5>eFootball</h5>
                <p>Футбол с любимой командой.</p>
                <p class="fg-success"><b>60 000 сумов</b></p>
                <a href="#" class="btn-solid theme-primary">Купить</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
