<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <title>Game gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  </head>
  <body>
    <main style="padding: 24px">
      <h1 class="fg-primary">My favorite games</h1>
      <img src="efootball.jpg" class="img-fluid rounded" alt="eFootball">
      <h3>Three more games</h3>
      <img src="minecraft.jpg" class="img-thumbnail" width="300" alt="Minecraft">
      <img src="roblox.jpg" class="img-thumbnail" width="300" alt="Roblox">
      <img src="efootball.jpg" class="img-thumbnail" width="300" alt="eFootball">
      <h4>New photos are loading...</h4>
      <div class="spinner-border fg-primary" role="status"><span class="visually-hidden">Loading...</span></div>
      <div class="spinner-grow fg-success" role="status"><span class="visually-hidden">Loading...</span></div>
      <div class="spinner-border fg-danger" role="status"><span class="visually-hidden">Loading...</span></div>
      <div class="spinner-grow fg-warning" role="status"><span class="visually-hidden">Loading...</span></div>
      <p class="placeholder-wave">
        <span class="placeholder col-6"></span>
        <span class="placeholder col-4"></span>
        <span class="placeholder col-8"></span>
      </p>
    </main>
  </body>
</html>
