<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <title>Supercars</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  </head>
  <body>
    <nav class="navbar md:navbar-expand bg-1" data-bs-theme="dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Supercars</a>
        <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#menyu" aria-label="Menu">
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog class="drawer drawer-end" id="menyu">
          <div class="drawer-header">
            <h5 class="drawer-title">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
          </div>
          <div class="drawer-body">
            <ul class="nav navbar-nav">
              <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="#">Cars</a></li>
              <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
            </ul>
          </div>
        </dialog>
      </div>
    </nav>
    <main style="padding: 24px">
      <div class="container" style="max-width: 760px">
        <div id="superkar" class="carousel slide" data-bs-autoplay="true">
          <div class="carousel-inner">
            <div class="carousel-item active"><img src="bmw.jpg" class="d-block w-100" alt="BMW M8"></div>
            <div class="carousel-item"><img src="porsche.jpg" class="d-block w-100" alt="Porsche 911 Turbo S"></div>
            <div class="carousel-item"><img src="mercedes.jpg" class="d-block w-100" alt="Mercedes-AMG One"></div>
          </div>
          <div class="d-flex justify-content-between align-items-center">
            <button class="btn-icon btn-sm" type="button" data-bs-target="#superkar" data-bs-slide="prev">
              <span class="carousel-icon-prev" aria-hidden="true"></span>
            </button>
            <div class="carousel-indicators">
              <button type="button" data-bs-target="#superkar" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
              <button type="button" data-bs-target="#superkar" data-bs-slide-to="1" aria-label="Slide 2"></button>
              <button type="button" data-bs-target="#superkar" data-bs-slide-to="2" aria-label="Slide 3"></button>
            </div>
            <button class="btn-icon btn-sm" type="button" data-bs-target="#superkar" data-bs-slide="next">
              <span class="carousel-icon-next" aria-hidden="true"></span>
            </button>
          </div>
        </div>
        <div class="row" style="margin-top: 16px">
          <div class="md:col-4">
            <div class="card">
              <div class="card-body">
                <h5>BMW M8</h5>
                <p class="fg-danger"><b>305 km/h</b></p>
              </div>
            </div>
          </div>
          <div class="md:col-4">
            <div class="card">
              <div class="card-body">
                <h5>Porsche 911 Turbo S</h5>
                <p class="fg-danger"><b>330 km/h</b></p>
              </div>
            </div>
          </div>
          <div class="md:col-4">
            <div class="card">
              <div class="card-body">
                <h5>Mercedes-AMG One</h5>
                <p class="fg-danger"><b>352 km/h</b></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
  </body>
</html>
