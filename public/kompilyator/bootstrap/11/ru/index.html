<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <title>Киберфестиваль</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  </head>
  <body>
    <nav class="navbar md:navbar-expand bg-1" data-bs-theme="dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Киберфестиваль</a>
        <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#menyu" aria-label="Menu">
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog class="drawer drawer-end" id="menyu">
          <div class="drawer-header">
            <h5 class="drawer-title">Меню</h5>
            <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
          </div>
          <div class="drawer-body">
            <ul class="nav navbar-nav">
              <li class="nav-item"><a class="nav-link active" href="#">Главная</a></li>
              <li class="nav-item"><a class="nav-link" href="#">Призы</a></li>
              <li class="nav-item">
                <button class="nav-link" type="button" data-bs-toggle="menu">Игры</button>
                <div class="menu">
                  <a class="menu-item" href="#">Minecraft</a>
                  <a class="menu-item" href="#">Roblox</a>
                  <a class="menu-item" href="#">eFootball</a>
                </div>
              </li>
            </ul>
          </div>
        </dialog>
      </div>
    </nav>
    <main style="padding: 24px">
      <div class="container" style="max-width: 640px">
        <div id="oyinlar" class="carousel slide">
          <div class="carousel-inner">
            <div class="carousel-item active"><img src="minecraft.jpg" class="d-block w-100" alt="Minecraft"></div>
            <div class="carousel-item"><img src="roblox.jpg" class="d-block w-100" alt="Roblox"></div>
            <div class="carousel-item"><img src="efootball.jpg" class="d-block w-100" alt="eFootball"></div>
          </div>
          <div class="d-flex justify-content-between align-items-center">
            <button class="btn-icon btn-sm" type="button" data-bs-target="#oyinlar" data-bs-slide="prev">
              <span class="carousel-icon-prev" aria-hidden="true"></span>
            </button>
            <button class="btn-icon btn-sm" type="button" data-bs-target="#oyinlar" data-bs-slide="next">
              <span class="carousel-icon-next" aria-hidden="true"></span>
            </button>
          </div>
        </div>
      </div>
      <div class="alert theme-info" role="alert" style="margin-top: 16px"><p>Фестиваль 14 декабря в школьном зале!</p></div>
      <div class="container">
        <div class="row">
          <div class="md:col-4">
            <div class="card">
              <div class="card-body">
                <h5>Minecraft</h5>
                <p class="fg-success"><b>Приз: 1 000 000 сумов</b></p>
              </div>
            </div>
          </div>
          <div class="md:col-4">
            <div class="card">
              <div class="card-body">
                <h5>Roblox</h5>
                <p class="fg-success"><b>Приз: 700 000 сумов</b></p>
              </div>
            </div>
          </div>
          <div class="md:col-4">
            <div class="card">
              <div class="card-body">
                <h5>eFootball</h5>
                <p class="fg-success"><b>Приз: 500 000 сумов</b></p>
              </div>
            </div>
          </div>
        </div>
      </div>
      <button class="btn-solid theme-danger" type="button" data-bs-toggle="dialog" data-bs-target="#qatnashish" style="margin-top: 16px">Участвовать</button>
      <dialog class="dialog" id="qatnashish">
        <div class="dialog-header">
          <h4 class="dialog-title">Участие</h4>
          <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Close"></button>
        </div>
        <div class="dialog-body">
          <form>
            <label for="ism" class="form-label">Имя</label>
            <input type="text" id="ism" class="form-control">
            <label for="oyin" class="form-label">Игра</label>
            <select id="oyin" class="form-control">
              <option>Minecraft</option>
              <option>Roblox</option>
              <option>eFootball</option>
            </select>
            <button type="submit" class="btn-solid theme-success" style="margin-top: 12px">Отправить</button>
          </form>
        </div>
      </dialog>
    </main>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
  </body>
</html>
