<!DOCTYPE html>
<html lang="uz" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <title>Minecraft turniri</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  </head>
  <body>
    <main style="padding: 24px">
      <img src="minecraft.jpg" alt="Minecraft" style="width: 100%; height: 240px; object-fit: cover; border-radius: 16px">
      <h1>Minecraft turniri 2026</h1>
      <div class="alert theme-success" role="alert">
        <p>Ro'yxat ochiq! Turnir 30-noyabr kuni, maktab kompyuter xonasida.</p>
      </div>
      <div class="alert theme-info" role="alert">
        <p>Har bir jamoada 3 nafar o'yinchi.</p>
      </div>
      <div class="alert theme-warning" role="alert">
        <p>Kompyuteringizni oldindan tekshiring!</p>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    </main>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
  </body>
</html>
